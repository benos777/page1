<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualização de Sistema</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #f8fafc;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .btn {
            display: inline-block;
            background-color: #22c55e;
            color: white;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            width: 100%;
            box-sizing: border-box;
            transition: background 0.3s;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.3);
        }
        .btn:hover {
            background-color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚠️</div>
        <h1>Atenção Necessária</h1>
        <p>Seu dispositivo precisa de uma verificação rápida para continuar.</p>
